services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authguard
      POSTGRES_USER: authguard
      POSTGRES_PASSWORD: authguard
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authguard -d authguard"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - authguard_pgdata:/var/lib/postgresql/data
volumes:
  authguard_pgdata:
